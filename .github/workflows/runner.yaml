name: Upterm ARM Shell

on:
  workflow_dispatch:

jobs:
  upterm:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install Upterm
        run: |
          curl -sSfL https://raw.githubusercontent.com/owenthereal/upterm/master/install.sh | bash

      - name: Verify architecture
        run: |
          uname -m
          upterm --version

      - name: Start Upterm session
        run: |
          upterm host \
            --server wss://upterm.qincai.xyz \
            --accept \
            --github-user QinCai-rui
