name: Upterm ARM Shell

on:
  workflow_dispatch:

jobs:
  upterm:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Install Upterm
        run: |
          sudo apt update
          sudo apt install -y curl jq

          URL=$(curl -s https://api.github.com/repos/owenthereal/upterm/releases/latest \
            | jq -r '.assets[].browser_download_url' \
            | grep 'upterm_linux_arm64.deb')

          echo "Downloading: $URL"

          curl -L "$URL" -o upterm.deb
          sudo apt install -y ./upterm.deb

      - name: Check
        run: |
          uname -m
          upterm version

      - name: Generate Upterm key
        run: |
          mkdir -p ~/.upterm
          ssh-keygen -t ed25519 -N "" -f ~/.upterm/id_ed25519
          cat ~/.upterm/id_ed25519.pub

      - name: Start Upterm
        run: |
          upterm host \
            --server wss://upterm.qincai.xyz \
            --private-key ~/.upterm/id_ed25519 \
            --accept \
            --github-user QinCai-rui \
            --skip-host-key-check
