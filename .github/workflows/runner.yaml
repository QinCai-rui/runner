name: Interactive Tailscale SSH Runner

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        required: true
        default: "ubuntu-x64"
        type: choice
        options:
          - ubuntu-x64
          - ubuntu-arm
          - windows-x64
          - macos-arm
          - macos-x64

      clone_armbian:
        description: "Clone QinCai-rui/armbian-build"
        required: true
        default: false
        type: boolean

      install_upterm:
        description: "Install Upterm"
        required: true
        default: false
        type: boolean

jobs:
  persistent-runner:
    runs-on: >-
      ${{
        inputs.runner == 'ubuntu-arm' && 'ubuntu-24.04-arm' ||
        inputs.runner == 'windows-x64' && 'windows-latest' ||
        inputs.runner == 'macos-arm' && 'macos-26' ||
        inputs.runner == 'macos-x64' && 'macos-26-intel' ||
        'ubuntu-latest'
      }}

    steps:
      # ------------------------------------------------------------
      # Basic system info
      # ------------------------------------------------------------

      - name: System information
        shell: bash
        run: |
          echo "========================================"
          echo "Runner information"
          echo "========================================"

          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"

          echo
          echo "=== uname ==="
          uname -a || true

          echo
          echo "=== Architecture ==="
          uname -m || true

          echo
          echo "=== CPU count ==="
          if command -v sysctl >/dev/null 2>&1; then
            sysctl -n hw.ncpu || true
          elif command -v nproc >/dev/null 2>&1; then
            nproc || true
          fi

          echo
          echo "=== Load ==="
          uptime || true

          echo
          echo "=== Top CPU processes ==="
          ps -Ao pid,%cpu,%mem,comm 2>/dev/null \
            | sort -k2 -nr \
            | head -20 || true

          echo
          echo "=== PerfPowerServices ==="
          ps aux 2>/dev/null \
            | grep '[P]erfPowerServices' || true

      # ------------------------------------------------------------
      # Linux depps
      # ------------------------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y curl jq

      # ------------------------------------------------------------
      # macOS deps
      # ------------------------------------------------------------

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install curl jq

      # ------------------------------------------------------------
      # Windows deps
      # ------------------------------------------------------------

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install jq -y

      # ------------------------------------------------------------ 
      # Tailscale 
      # ------------------------------------------------------------

      - name: Install and connect Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTH_KEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: secrets.TS_AUTH_KEY is empty or not set"
            exit 1
          fi

          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh

            sudo tailscale up --auth-key="$TS_AUTHKEY"
            sudo tailscale set --ssh

          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install --quiet tailscale

            sudo tailscaled install-system-daemon
            sudo tailscale up --auth-key="$TS_AUTHKEY"
            sudo tailscale set --ssh

          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install tailscale -y --no-progress

            # In Git Bash on Windows, C:\ is mounted at /c/
            TAILSCALE="/c/Program Files/Tailscale/tailscale.exe"
            "$TAILSCALE" up --auth-key="$TS_AUTHKEY"

            # Add Tailscale to PATH for subsequent steps (use Windows-style paths for GITHUB_PATH)
            echo "C:/Program Files/Tailscale" >> "$GITHUB_PATH"
            echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          else
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
          fi

          echo
          echo "Tailscale IP:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "/c/Program Files/Tailscale/tailscale.exe" ip
          else
            tailscale ip
          fi

      # ------------------------------------------------------------
      # Tailscale information
      # ------------------------------------------------------------

      - name: Show Tailscale information
        shell: bash
        run: |
          echo "=== Tailscale ==="

          if command -v tailscale >/dev/null 2>&1; then
            echo "Tailscale IP:"
            tailscale ip || true
          else
            echo "tailscale command not found"
          fi

      # ------------------------------------------------------------
      # macOS SSH
      #
      # Enable the normal macOS SSH server
      # ------------------------------------------------------------

      - name: Enable macOS SSH
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Enabling macOS SSH..."

          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true

          echo
          echo "SSH status:"
          sudo launchctl list | grep ssh || true

          echo
          echo "Tailscale IP:"
          tailscale ip | head -1

          echo
          echo "Current user:"
          whoami

      # ------------------------------------------------------------
      # Linux SSH
      # ------------------------------------------------------------

      - name: Enable Linux SSH
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl enable --now ssh 2>/dev/null || \
          sudo systemctl enable --now sshd 2>/dev/null || true

          echo
          echo "Tailscale IP:"
          tailscale ip | head -1

          echo
          echo "Current user:"
          whoami

      # ------------------------------------------------------------
      # Windows OpenSSH
      # ------------------------------------------------------------

      - name: Enable Windows SSH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic

          Write-Host ""
          Write-Host "Current user:"
          whoami

          Write-Host ""
          Write-Host "Tailscale IP (if available):"
          tailscale ip 2> $null
          if ($LASTEXITCODE -ne 0) { Write-Host "tailscale not found in PATH" }

      # ------------------------------------------------------------
      # Add GitHub SSH public keys
      # ------------------------------------------------------------

      - name: Add GitHub SSH public keys (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e

          KEYS_URL="https://github.com/QinCai-rui.keys"

          echo "Fetching SSH public keys from $KEYS_URL ..."

          KEYS=$(curl -fsSL "$KEYS_URL")

          if [ -z "$KEYS" ]; then
            echo "No keys found for user QinCai-rui"
            exit 1
          fi

          SSH_DIR="$HOME/.ssh"
          AUTH_KEYS="$SSH_DIR/authorized_keys"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          echo "$KEYS" >> "$AUTH_KEYS"
          chmod 600 "$AUTH_KEYS"
          echo
          echo "Added keys:"
          echo "$KEYS" | wc -l | xargs -I {} echo "{} key(s) added to $AUTH_KEYS"

      - name: Add GitHub SSH public keys (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $KeysUrl = "https://github.com/QinCai-rui.keys"
          Write-Host "Fetching SSH public keys from $KeysUrl ..."

          $Keys = (Invoke-WebRequest -UseBasicParsing -Uri $KeysUrl).Content.Trim()

          if (-not $Keys) {
            Write-Host "No keys found for user QinCai-rui"
            exit 1
          }

          # 1) Regular user authorized_keys (%USERPROFILE%\.ssh\authorized_keys)
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          $authKeys = Join-Path $sshDir "authorized_keys"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $Keys | Out-File -FilePath $authKeys -Encoding utf8 -Append
          Write-Host "Added to $authKeys"

          # Fix ACLs for regular authorized_keys (only user + SYSTEM)
          icacls $sshDir /inheritance:r  | Out-Null
          icacls $sshDir /grant "${env:USERNAME}:F" /grant "SYSTEM:F" | Out-Null
          icacls $authKeys /inheritance:r | Out-Null
          icacls $authKeys /grant "${env:USERNAME}:F" /grant "SYSTEM:F" | Out-Null

          # 2) Administrators authorized_keys - REQUIRED for admin users on Windows OpenSSH
          # runneradmin is an administrator, so sshd reads C:\ProgramData\ssh\administrators_authorized_keys
          $adminKeys = "C:\ProgramData\ssh\administrators_authorized_keys"
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\ssh" | Out-Null
          $Keys | Out-File -FilePath $adminKeys -Encoding utf8 -Append
          Write-Host "Added to $adminKeys"

          # Fix ACLs for administrators_authorized_keys (only SYSTEM + Administrators)
          icacls $adminKeys /inheritance:r | Out-Null
          icacls $adminKeys /grant "SYSTEM:F" /grant "Administrators:F" | Out-Null

          Write-Host ""
          Write-Host "Keys:"
          Write-Host $Keys
          icacls $authKeys
          icacls $adminKeys

      # ------------------------------------------------------------
      # Install Upterm
      # ------------------------------------------------------------

      - name: Install Upterm
        if: ${{ inputs.install_upterm }}
        shell: bash
        run: |
          set -e

          OS=""

          case "$RUNNER_OS" in
            Linux)
              OS="linux"
              ;;
            macOS)
              OS="darwin"
              ;;
            Windows)
              OS="windows"
              ;;
            *)
              echo "Unsupported OS"
              exit 1
              ;;
          esac

          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          echo "OS: $OS"
          echo "Architecture: $ARCH"

          echo
          echo "Fetching latest Upterm release..."

          URL="$(
            curl -fsSL \
              https://api.github.com/repos/owenthereal/upterm/releases/latest |
            jq -r \
              --arg pattern "upterm_${OS}_${ARCH}.tar.gz" \
              '.assets[] | select(.name == $pattern) | .browser_download_url'
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "Could not find Upterm release"
            exit 1
          fi

          echo "Downloading upterm: $URL"
          curl -fL "$URL" -o upterm.tar.gz
          tar -xzf upterm.tar.gz

          # Also download uptermd (daemon) — separate package on Linux
          if [ "$OS" = "linux" ]; then
            UPTERMD_URL="$(
              curl -fsSL \
                https://api.github.com/repos/owenthereal/upterm/releases/latest |
              jq -r \
                --arg pattern "uptermd_${OS}_${ARCH}.tar.gz" \
                '.assets[] | select(.name == $pattern) | .browser_download_url'
            )"
            if [ -n "$UPTERMD_URL" ] && [ "$UPTERMD_URL" != "null" ]; then
              echo "Downloading uptermd: $UPTERMD_URL"
              curl -fL "$UPTERMD_URL" -o uptermd.tar.gz
              tar -xzf uptermd.tar.gz
            fi
          fi

          echo
          echo "Installing..."

          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p "$HOME/.local/bin"
            cp upterm.exe "$HOME/.local/bin/upterm.exe"
            cp uptermd.exe "$HOME/.local/bin/uptermd.exe" 2>/dev/null || true
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            sudo install upterm /usr/local/bin/upterm
            [ -f uptermd ] && sudo install uptermd /usr/local/bin/uptermd
          fi

          echo
          echo "Versions:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$HOME/.local/bin/upterm.exe" version
            "$HOME/.local/bin/uptermd.exe" version 2>/dev/null || true
          else
            upterm version
            uptermd version 2>/dev/null || true
          fi

      # ------------------------------------------------------------
      # Generate Upterm key
      # ------------------------------------------------------------

      - name: Generate Upterm key
        shell: bash
        run: |
          mkdir -p ~/.upterm

          ssh-keygen \
            -t ed25519 \
            -N "" \
            -f ~/.upterm/id_ed25519

          echo
          echo "Upterm public key:"
          cat ~/.upterm/id_ed25519.pub

      # ------------------------------------------------------------
      # Start Upterm daemon
      # ------------------------------------------------------------

      - name: Start Upterm daemon
        if: ${{ inputs.install_upterm }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$HOME/.local/bin/upterm.exe" host \
              --server wss://upterm.qincai.xyz \
              --private-key ~/.upterm/id_ed25519 \
              --accept \
              --github-user QinCai-rui \
              --skip-host-key-check &
          else
            upterm host \
              --server wss://upterm.qincai.xyz \
              --private-key ~/.upterm/id_ed25519 \
              --accept \
              --github-user QinCai-rui \
              --skip-host-key-check &
          fi

      # ------------------------------------------------------------
      # Detailed diagnostics
      # ------------------------------------------------------------

      - name: CPU diagnostics
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "CPU DIAGNOSTICS"
          echo "========================================"

          echo
          echo "=== OS ==="
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"

          echo
          echo "=== Kernel ==="
          uname -a || true

          echo
          echo "=== CPU architecture ==="
          uname -m || true

          echo
          echo "=== CPU count ==="
          if command -v sysctl >/dev/null 2>&1; then
            sysctl -n hw.ncpu || true
            sysctl -n hw.logicalcpu 2>/dev/null || true
            sysctl -n hw.physicalcpu 2>/dev/null || true
          elif command -v nproc >/dev/null 2>&1; then
            nproc || true
          fi

          echo
          echo "=== Load ==="
          uptime || true

          echo
          echo "=== Top CPU processes ==="
          ps -Ao pid,%cpu,%mem,comm 2>/dev/null \
            | sort -k2 -nr \
            | head -30 || true

          if [ "$RUNNER_OS" = "macOS" ]; then
            echo
            echo "=== PerfPowerServices ==="
            ps aux | grep '[P]erfPowerServices' || true

            echo
            echo "=== Power-related processes ==="
            ps aux \
              | grep -Ei 'power|thermal|smc|perf' \
              | grep -v grep \
              || true
          fi

      # ------------------------------------------------------------
      # Checkout Armbian
      # ------------------------------------------------------------

      - name: Checkout Armbian build
        if: ${{ inputs.clone_armbian }}
        uses: actions/checkout@v4
        with:
          repository: QinCai-rui/armbian-build
          ref: a733-mainline
          path: armbian-build

      # ------------------------------------------------------------
      # Keep runner alive
      # ------------------------------------------------------------

      - name: Keep runner alive
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "RUNNER READY"
          echo "========================================"

          echo
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

          echo
          echo "Tailscale IP:"
          tailscale ip | head -1

          echo
          echo "Username:"
          whoami

          echo
          echo "SSH:"
          echo "ssh $(whoami)@$(tailscale ip | head -1)"

          echo
          echo "Runner will remain alive until the GitHub job timeout."

          while true; do
            sleep 3600
          done
